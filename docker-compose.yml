# 小雅 Alist → Emby strm 生成器
#
# 常驻定时模式（推荐）：docker compose up -d strm-gen   # 按 CRON 每天自动同步
# 手动跑一次：        docker compose run --rm strm-gen
# 加新目录：只改下方 environment 里的 MAPPINGS（加一条映射），不用改代码
services:
  strm-gen:
    container_name: strm-gen
    image: bossjun/strm-gen:1.0.8
    # ghcr.io/junboss1013/strm-gen:latest 也可用（需先在网页把包设为 Public）
    # 本地改完代码想自用时，改用下面两行代替 image：
    # build: .
    # image: strm-gen:local

    # host 网络：容器内 127.0.0.1:5678 即宿主机的小雅 Alist
    network_mode: host
    restart: unless-stopped

    environment:
      # ---- Alist（内网地址，host 网络下用 127.0.0.1）----
      ALIST_BASE: "http://127.0.0.1:5678"
      ALIST_USERNAME: "wxs"
      ALIST_PASSWORD: "Wu961013@"

      # ---- strm 直链前缀（播放器实际访问的公网 Alist 地址）----
      PUBLIC_PREFIX: "https://xiaoya.10131127.xyz:15617"

      # ---- Emby（用于触发媒体库刷新，可留空则跳过刷新）----
      EMBY_PUBLIC: "https://xemby.10131127.xyz:15617"
      EMBY_API_KEY: "a0000939efe14af6a40d024cf8f827fe"
      EMBY_CONTAINER: "emby"
      AUTO_SCAN: "true"

      # ---- 时区（影响 CRON 按本地时间执行）----
      TZ: "Asia/Shanghai"

      # ---- 定时自动同步：5 段 cron（分 时 日 月 周）----
      # 设了 CRON 容器即常驻并按点执行；注释掉则只手动跑
      # 例："0 3 * * *" 每天 03:00；"*/30 * * * *" 每 30 分钟
      CRON: "0 */2 * * *"

      # ---- Webhook 实时刷新（推荐）----
      # 开启后容器常驻一个 HTTP 服务，插件转存成功后 POST /refresh 立即同步 strm + 刷新 Emby。
      # 与上面的 CRON 可同时开启：webhook 负责实时，cron 负责兜底。
      WEBHOOK_ENABLED: "true"
      WEBHOOK_PORT: "5679"          # host 网络下直接监听宿主机此端口，别和 Alist 5678 冲突
      WEBHOOK_TOKEN: "strmrefresh2026"  # 自定义一个强 token，插件调用时需带 X-Webhook-Token 头
      WEBHOOK_DELAY: "30"           # 触发前延迟秒数；115 离线下载建议设 30-60 给下载/索引留时间

      # ---- Emby 定向媒体库定时扫描（独立于 strm 同步 / webhook）----
      # 每 3 小时扫描一次「电视剧/每日更新」和「电影/每日更新」两个媒体库（内网地址）
      EMBY_SCAN_ENABLED: "true"
      EMBY_SCAN_CRON: "0 */3 * * *"       # 每 3 小时整点扫描
      EMBY_SCAN_BASE: "http://192.168.0.4:2345"
      EMBY_SCAN_API_KEY: "a0000939efe14af6a40d024cf8f827fe"
      EMBY_SCAN_LIBS: "电视剧/每日更新,电影/每日更新"
      EMBY_SCAN_PATHS: "/media/每日更新/电视剧,/media/每日更新/电影"   # 兜底根路径（库名解析不到时用）
      EMBY_SCAN_MODE: "validation"        # validation=只校验文件秒级入库（推荐）；refresh=旧全库刮削（极慢）
      EMBY_BACKFILL_ENABLED: "true"       # 扫描后给缺海报的新条目自动补刮元数据（本版新增）
      EMBY_BACKFILL_LIMIT: "30"           # 每轮最多补刮多少个条目
      EMBY_BACKFILL_MAX_TRIES: "3"        # 单条目最多重试次数，超过后冷却 7 天
      EMBY_BACKFILL_DELAY: "10"           # 扫描完成后等待几秒再补刮，给库扫描留出建条目时间
      EMBY_EPISODE_ENABLED: "true"        # 阶段 C：给缺元数据的单集补标题/简介/剧照（按剧 Recursive 刷新）
      EMBY_EPISODE_LIMIT: "10"            # 每轮最多处理多少部剧（缺集数少的优先，小剧先清完）
      EMBY_EPISODE_MAX_TRIES: "3"         # 同一部剧连续几轮没进展就冷却
      EMBY_EPISODE_DELAY: "5"             # 每部剧触发间隔秒数，别把 Emby 刷新队列挤爆
      EMBY_EPISODE_MAX_PER_SERIES: "200"  # 单剧缺集超过这个数就跳过（避免千集大剧占住刷新队列）

      # ---- 增量合并：写入前不清空目标目录，保留已有历史 strm ----
      # 目标目录「每日更新」里已有大量历史 strm，必须开合并模式，否则会被清空
      MERGE_MODE: "true"

      # ---- 目录映射：加新目录就在这里加一条 ----
      # type 取 movie 或 tv；emby_path 必须是 Emby 媒体库已扫描的路径
      # alist_path=教父转存落点(115影视库)；emby_path=目标媒体库路径(每日更新)
      MAPPINGS: >-
        [
          {"alist_path":"/🥝115网盘/115/影视库/电影","type":"movie","emby_path":"/media/每日更新/电影"},
          {"alist_path":"/🥝115网盘/115/影视库/电视剧","type":"tv","emby_path":"/media/每日更新/电视剧"}
        ]

    volumes:
      # 写入 Emby 容器媒体库（其 /media 是容器内层叠镜像，必须走 docker.sock + tar）
      - /var/run/docker.sock:/var/run/docker.sock
      # 运行日志持久
      - ./strmgen-out:/out
